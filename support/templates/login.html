{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="panel narrow">
  <p class="eyebrow">SUPPORT DESK</p>
  <h1>{% if view.admin_portal %}Admin{% else %}Employee{% endif %} sign in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
